  {

// ============ STORAGE ============
// Dual-channel storage:
//   - localStorage (LS_KEY): primary, instant, works offline & in Safari standalone
//   - window.storage (STORAGE_KEY): Claude App cloud sync, best effort
// Debounced saves prevent API failures from rapid successive answers.

const STORAGE_KEY = 'practice-data';
const LS_KEY = 'cl-practice-data-v1';

const defaultData = () => ({
  attempts: {},
  wrongList: [],
  mastered: [],
  stats: {
    allTimeAnswered: 0,
    allTimeCorrect: 0,
    todayAnswered: 0,
    todayCorrect: 0,
    lastDate: ''
  },
  currentSession: { answered: 0, correct: 0 },
  lastUpdated: 0
});

let userData = defaultData();
let saveTimer = null;
let savingNow = false;

async function loadData() {
  let lsData = null, wsData = null;

  // Try localStorage first
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) lsData = JSON.parse(raw);
  } catch (e) {}

  // Try window.storage (Claude App)
  try {
    if (typeof window.storage !== 'undefined' && window.storage && window.storage.get) {
      const r = await window.storage.get(STORAGE_KEY);
      if (r && r.value) wsData = JSON.parse(r.value);
    }
  } catch (e) {}

  // Pick the newer copy (handles migration: existing window.storage data wins on first load)
  let loaded = null;
  if (lsData && wsData) {
    loaded = (lsData.lastUpdated || 0) >= (wsData.lastUpdated || 0) ? lsData : wsData;
  } else {
    loaded = lsData || wsData;
  }

  if (loaded) {
    userData = { ...defaultData(), ...loaded };
    const today = new Date().toISOString().slice(0, 10);
    if (userData.stats.lastDate !== today) {
      userData.stats.todayAnswered = 0;
      userData.stats.todayCorrect = 0;
      userData.stats.lastDate = today;
    }
    userData.currentSession = { answered: 0, correct: 0 };
  } else {
    userData = defaultData();
    userData.stats.lastDate = new Date().toISOString().slice(0, 10);
  }
}

// Debounced save — batches updates within 500ms, prevents storage API spam
function saveData() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}

async function doSave() {
  if (savingNow) return;
  savingNow = true;
  saveTimer = null;
  try {
    userData.lastUpdated = Date.now();
    const data = JSON.stringify(userData);

    // Primary: localStorage (instant, reliable, works offline)
    try { localStorage.setItem(LS_KEY, data); } catch (e) {}

    // Secondary: window.storage (Claude App cloud sync, silent on failure)
    try {
      if (typeof window.storage !== 'undefined' && window.storage && window.storage.set) {
        await window.storage.set(STORAGE_KEY, data);
      }
    } catch (e) {
      // Silent: localStorage already has the data
    }
  } finally {
    savingNow = false;
  }
}

// Flush pending writes when app is hidden/closed (catches mid-session exits)
function flushSave() {
  if (saveTimer) {
    clearTimeout(saveTimer);
    saveTimer = null;
  }
  try {
    userData.lastUpdated = Date.now();
    localStorage.setItem(LS_KEY, JSON.stringify(userData));
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);

async function resetData() {
  if (!confirm('確定要清除所有刷題紀錄嗎？此操作無法復原。')) return;
  userData = defaultData();
  userData.stats.lastDate = new Date().toISOString().slice(0, 10);
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  try {
    if (typeof window.storage !== 'undefined' && window.storage && window.storage.delete) {
      await window.storage.delete(STORAGE_KEY);
    }
  } catch (e) {}
  state.view = 'home';
  render();
}

// ============ EXPORT / IMPORT ============
function showModal(html) {
  closeModal();
  const wrap = document.createElement('div');
  wrap.id = 'modalWrap';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;';
  wrap.innerHTML = html;
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeModal(); });
  document.body.appendChild(wrap);
}

function closeModal() {
  const m = document.getElementById('modalWrap');
  if (m) m.remove();
}

function exportData() {
  const json = JSON.stringify(userData, null, 2);
  const escaped = json.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const sizeKB = (json.length / 1024).toFixed(1);
  showModal(`
    <div class="bg-white rounded-2xl p-5 shadow-lg" style="max-width:500px;width:100%;max-height:85vh;display:flex;flex-direction:column;">

      <textarea id="exportText" readonly style="flex:1;min-height:160px;padding:0.5rem;border:2px solid #e7e5e4;border-radius:0.5rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;resize:vertical;line-height:1.4;-webkit-user-select:text;user-select:text;">${escaped}</textarea>
      <div class="text-xs text-stone-500 mt-1 mb-3">資料大小：${sizeKB} KB</div>
      <div class="flex gap-2">
        <button onclick="copyExport()" class="opt-btn flex-1 navy text-white rounded-lg py-2 font-bold text-sm">複製文字</button>
        <button onclick="downloadExport()" class="opt-btn flex-1 navy text-white rounded-lg py-2 font-bold text-sm">下載 .txt</button>
      </div>
      <button onclick="closeModal()" class="opt-btn w-full bg-stone-100 text-stone-700 rounded-lg py-2 font-bold text-sm mt-2">關閉</button>
    </div>
  `);
}

async function copyExport() {
  const ta = document.getElementById('exportText');
  if (!ta) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(ta.value);
    } else {
      ta.select();
      document.execCommand('copy');
    }
    alert('✓ 已複製到剪貼簿');
  } catch (e) {
    try { ta.select(); } catch (e2) {}
    alert('請手動長按選取文字後複製');
  }
}

function downloadExport() {
  const json = JSON.stringify(userData, null, 2);
  const blob = new Blob([json], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `備考刷題進度_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 200);
}

function importData() {
  showModal(`
    <div class="bg-white rounded-2xl p-5 shadow-lg" style="max-width:500px;width:100%;max-height:85vh;display:flex;flex-direction:column;">
      <div class="font-bold text-lg navy-text mb-2">📥 匯入進度</div>
      <div class="text-sm text-stone-600 mb-1">貼上備份文字或選擇 .txt 檔。</div>
      <div class="text-xs text-red-700 font-semibold mb-3">⚠ 此操作會覆蓋目前所有進度</div>
      <textarea id="importText" placeholder="把備份文字貼到這裡..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="flex:1;min-height:160px;padding:0.5rem;border:2px solid #e7e5e4;border-radius:0.5rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;resize:vertical;line-height:1.4;-webkit-user-select:text;user-select:text;"></textarea>
      <div class="flex gap-2 mt-3">
        <button onclick="uploadImport()" class="opt-btn flex-1 bg-stone-100 text-stone-700 rounded-lg py-2 font-bold text-sm">📁 從檔案載入</button>
        <button onclick="confirmImport()" class="opt-btn flex-1 navy text-white rounded-lg py-2 font-bold text-sm">確認匯入</button>
      </div>
      <button onclick="closeModal()" class="opt-btn w-full bg-stone-100 text-stone-700 rounded-lg py-2 font-bold text-sm mt-2">取消</button>
    </div>
  `);
}

function uploadImport() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.txt,.json,text/plain,application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const ta = document.getElementById('importText');
      if (ta) ta.value = ev.target.result;
    };
    reader.readAsText(file);
  };
  input.click();
}

async function confirmImport() {
  const ta = document.getElementById('importText');
  let text = ta ? ta.value.trim() : '';
  if (!text) { alert('請先貼上備份文字或從檔案載入'); return; }
  // Normalize iOS smart quotes → straight quotes (JSON parser needs straight)
  text = text
    .replace(/[\u201C\u201D\u201E\u201F]/g, '"')
    .replace(/[\u2018\u2019\u201A\u201B]/g, "'")
    .replace(/\u2026/g, '...')
    .replace(/[\u2013\u2014]/g, '-');
  try {
    const parsed = JSON.parse(text);
    if (!parsed.stats || typeof parsed.attempts !== 'object') {
      throw new Error('Invalid format');
    }
    userData = { ...defaultData(), ...parsed };
    await doSave();
    closeModal();
    const stats = userData.stats || {};
    alert(`✓ 匯入成功！\n已答題：${stats.allTimeAnswered || 0} 題\n錯題：${(userData.wrongList || []).length} 題`);
    state.view = 'home';
    render();
  } catch (e) {
    alert('✗ 匯入失敗：文字格式不正確\n請確認是從本 App 匯出的完整資料');
  }
}

function getFilteredQuestions() {
  return QUESTIONS.filter(q => {
    if (state.filter.tier !== 'all' && q.tier !== state.filter.tier) return false;
    if (state.filter.subject !== 'all' && q.subject !== state.filter.subject) return false;
    return true;
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function tierBadge(tier) {
  const map = { S: 'tier-s', A: 'tier-a', B: 'tier-a', C: 'tier-c' };
  return `<span class="badge ${map[tier] || 'tier-a'}">${tier} 級</span>`;
}

  if (state.view === 'home') renderHome(app);

  else if (state.view === 'flashcard') renderFlashcard(app);

      </div>
      <div class="text-base font-semibold mb-4 leading-relaxed selectable">${q.q}</div>
      <div class="space-y-2 mb-4" id="opts">
        ${q.opts.map((opt, i) => `
          <button id="opt${i}" onclick="selectOption(${i})"
            class="opt-btn w-full text-left p-3 rounded-lg border-2 border-stone-200 bg-white font-medium leading-relaxed">
            <span class="font-bold navy-text mr-2">(${String.fromCharCode(65+i)})</span>${opt}
          </button>
        `).join('')}
      </div>
      <div id="feedback"></div>
    </div>
  `;
}

async function selectOption(i) {
  if (state.answered) return;
  state.selected = i;
  state.answered = true;
  const q = state.quizQueue[state.quizIndex];
  const correct = i === q.ans;

  // Update stats
  userData.stats.allTimeAnswered++;
  userData.stats.todayAnswered++;
  userData.currentSession.answered++;
  if (correct) {
    userData.stats.allTimeCorrect++;
    userData.stats.todayCorrect++;
    userData.currentSession.correct++;
  }

  // Update attempts
  if (!userData.attempts[q.id]) userData.attempts[q.id] = { tries: 0, correct: 0, lastWrong: null };
  userData.attempts[q.id].tries++;
  if (correct) {
    userData.attempts[q.id].correct++;
    // remove from wrong list if mastered (got it right after wrong)
    // Keep it for review, only remove if user explicitly marks mastered
  } else {
    userData.attempts[q.id].lastWrong = Date.now();
    // Add to wrongList if not already there
    if (!userData.wrongList.includes(q.id)) {
      userData.wrongList.unshift(q.id);
    }
  }

  await saveData();

  // UI feedback
  document.querySelectorAll('#opts button').forEach(btn => btn.classList.add('opt-disabled'));
  document.getElementById(`opt${q.ans}`).classList.add('opt-correct');
  if (!correct) document.getElementById(`opt${i}`).classList.add('opt-wrong');

  const fb = document.getElementById('feedback');
  fb.innerHTML = `
    <div class="fade-in space-y-3">
      <div class="${correct ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'} border-2 rounded-lg p-3">
        <div class="font-bold ${correct ? 'text-green-700' : 'text-red-700'} mb-2 flex items-center gap-2">
          ${correct ? '✓ 答對了' : '✗ 答錯'}
          ${!correct ? `<span class="text-xs font-normal text-stone-600">（已加入錯題本）</span>` : ''}
        </div>
        <div class="text-sm text-stone-700 leading-relaxed selectable">
          <span class="font-bold">詳解：</span>${q.exp}
        </div>
      </div>
      <button onclick="nextQuestion()" class="opt-btn w-full navy text-white rounded-xl py-3 font-bold">
        ${state.quizIndex < state.quizQueue.length - 1 ? '下一題 ›' : '完成本輪'}
      </button>
    </div>
  `;
  // scroll to feedback
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextQuestion() {
  state.quizIndex++;
  state.selected = null;
  state.answered = false;
  render();
}

// ---------- FLASHCARD ----------
function startFlashcard() {
  state.fcIndex = 0;
  state.fcShowBack = false;
  state.fcCat = 'all';
  state.view = 'flashcard';
  render();
}

function getFilteredCards() {
  return state.fcCat === 'all' ? FLASHCARDS : FLASHCARDS.filter(c => c.cat === state.fcCat);
}

function renderFlashcard(app) {
  const cards = getFilteredCards();
  const cats = ['all', ...new Set(FLASHCARDS.map(c => c.cat))];
  if (cards.length === 0) {
    state.fcCat = 'all';
    render();
    return;
  }
  if (state.fcIndex >= cards.length) state.fcIndex = 0;
  const card = cards[state.fcIndex];

  app.innerHTML = `
    ${topBar('閃卡模式')}
    <div class="p-4 fade-in">
      <div class="flex gap-2 flex-wrap mb-4">
        ${cats.map(c => `
          <button onclick="setFcCat('${c}')" class="opt-btn px-3 py-1 rounded-lg text-xs font-semibold ${state.fcCat === c ? 'navy text-white' : 'bg-stone-100 text-stone-600'}">
            ${c === 'all' ? '全部' : c}
          </button>
        `).join('')}
      </div>
      <div class="text-center text-sm text-stone-500 mb-2">${state.fcIndex + 1} / ${cards.length}</div>
      <div onclick="flipCard()" class="bg-white rounded-2xl shadow-lg p-8 min-h-card flex flex-col items-center justify-center text-center cursor-pointer mb-4 border-2 ${state.fcShowBack ? 'border-yellow-400' : 'border-stone-200'}">
        <div class="text-xs text-stone-400 mb-3 uppercase tracking-wider">${state.fcShowBack ? '答案' : '題目'}</div>
        <div class="text-xl font-bold ${state.fcShowBack ? 'gold-text' : 'navy-text'} leading-relaxed selectable">
          ${state.fcShowBack ? card.b : card.f}
        </div>
        <div class="text-xs text-stone-400 mt-4">${state.fcShowBack ? '點卡片返回題目' : '點卡片看答案'}</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="prevCard()" class="opt-btn bg-white border-2 border-stone-200 rounded-xl py-3 font-bold text-stone-700">‹ 上一張</button>
        <button onclick="nextCard()" class="opt-btn navy text-white rounded-xl py-3 font-bold">下一張 ›</button>
      </div>
    </div>
  `;
}

function setFcCat(c) {
  state.fcCat = c;
  state.fcIndex = 0;
  state.fcShowBack = false;
  render();
}

function flipCard() {
  state.fcShowBack = !state.fcShowBack;
  render();
}

function nextCard() {
  const cards = getFilteredCards();
  state.fcIndex = (state.fcIndex + 1) % cards.length;
  state.fcShowBack = false;
  render();
}

function prevCard() {
  const cards = getFilteredCards();
  state.fcIndex = (state.fcIndex - 1 + cards.length) % cards.length;
  state.fcShowBack = false;
  render();
}

// ---------- WRONG ANSWER BOOK ----------
function renderWrong(app) {
  const wrongQs = userData.wrongList.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);

  if (wrongQs.length === 0) {
    app.innerHTML = `
      ${topBar('錯題本')}
      <div class="p-6 text-center">
        <div class="text-6xl mb-4">📭</div>
        <div class="text-lg font-bold mb-2">錯題本是空的</div>
        <div class="text-sm text-stone-500 mb-6">先去刷題，答錯的會自動收進來</div>
        <button onclick="startQuiz()" class="opt-btn w-full navy text-white rounded-xl py-3 font-bold">開始刷題</button>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    ${topBar(`錯題本（${wrongQs.length}）`)}
    <div class="p-4 space-y-3 fade-in">
      <button onclick="redoAllWrong()" class="opt-btn w-full navy text-white rounded-xl py-3 font-bold">重做所有錯題</button>
      ${wrongQs.map(q => {
        const att = userData.attempts[q.id] || {};
        const wrongTimes = (att.tries || 0) - (att.correct || 0);
        return `
        <div class="bg-white rounded-xl p-3 shadow-sm border-l-4 border-red-400">
          <div class="flex items-center gap-2 mb-2 flex-wrap">
            ${tierBadge(q.tier)}
            <span class="badge bg-stone-200 text-stone-700">${q.subject}</span>
            <span class="badge bg-stone-200 text-stone-700">${q.topic}</span>
            <span class="badge bg-red-100 text-red-700">錯 ${wrongTimes} 次</span>
          </div>
          <div class="text-sm font-medium mb-2 leading-relaxed selectable">${q.q}</div>
          <div class="text-xs text-stone-500 mb-2 selectable">
            <span class="font-bold text-green-600">正解：(${String.fromCharCode(65+q.ans)}) ${q.opts[q.ans]}</span>
          </div>
          <div class="text-xs text-stone-600 mb-2 selectable">${q.exp}</div>
          <div class="flex gap-2">
            <button onclick="redoSingle('${q.id}')" class="opt-btn flex-1 bg-stone-100 text-stone-700 rounded-lg py-2 text-sm font-semibold">重做</button>
            <button onclick="markMastered('${q.id}')" class="opt-btn flex-1 bg-green-100 text-green-700 rounded-lg py-2 text-sm font-semibold">已掌握 ✓</button>
          </div>
        </div>
        `;
      }).join('')}
    </div>
  `;
}

function redoAllWrong() {
  state.quizQueue = shuffle(userData.wrongList.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean));
  state.quizIndex = 0;
  state.selected = null;
  state.answered = false;
  userData.currentSession = { answered: 0, correct: 0 };
  state.view = 'quiz';
  render();
}

function redoSingle(qid) {
  const q = QUESTIONS.find(x => x.id === qid);
  if (!q) return;
  state.quizQueue = [q];
  state.quizIndex = 0;
  state.selected = null;
  state.answered = false;
  userData.currentSession = { answered: 0, correct: 0 };
  state.view = 'quiz';
  render();
}

async function markMastered(qid) {
  userData.wrongList = userData.wrongList.filter(id => id !== qid);
  if (!userData.mastered.includes(qid)) userData.mastered.push(qid);
  await saveData();
  render();
}

// ---------- STATS ----------
function renderStats(app) {
  const s = userData.stats;
  const acc = s.allTimeAnswered > 0 ? Math.round((s.allTimeCorrect / s.allTimeAnswered) * 100) : 0;
  const todayAcc = s.todayAnswered > 0 ? Math.round((s.todayCorrect / s.todayAnswered) * 100) : 0;

  // by subject
  const bySubj = {};
  Object.entries(userData.attempts).forEach(([qid, att]) => {
    const q = QUESTIONS.find(x => x.id === qid);
    if (!q) return;
    if (!bySubj[q.subject]) bySubj[q.subject] = { tries: 0, correct: 0 };
    bySubj[q.subject].tries += att.tries;
    bySubj[q.subject].correct += att.correct;
  });

  // by tier
  const byTier = {};
  Object.entries(userData.attempts).forEach(([qid, att]) => {
    const q = QUESTIONS.find(x => x.id === qid);
    if (!q) return;
    if (!byTier[q.tier]) byTier[q.tier] = { tries: 0, correct: 0 };
    byTier[q.tier].tries += att.tries;
    byTier[q.tier].correct += att.correct;
  });

  app.innerHTML = `
    ${topBar('學習統計')}
    <div class="p-4 space-y-4 fade-in">
      <div class="bg-white rounded-xl p-4 shadow-sm">
        <div class="text-sm text-stone-500 mb-1">總正確率</div>
        <div class="text-4xl font-bold ${acc >= 70 ? 'text-green-600' : acc >= 50 ? 'text-orange-500' : 'text-red-500'}">${acc}%</div>
        <div class="text-sm text-stone-600 mt-1">${s.allTimeCorrect} 對 / ${s.allTimeAnswered} 題</div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-xl p-4 shadow-sm">
          <div class="text-xs text-stone-500">今日</div>
          <div class="text-2xl font-bold navy-text">${s.todayAnswered}</div>
          <div class="text-xs text-stone-500">正確率 ${todayAcc}%</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm">
          <div class="text-xs text-stone-500">已掌握</div>
          <div class="text-2xl font-bold text-green-600">${userData.mastered.length}</div>
          <div class="text-xs text-stone-500">題</div>
        </div>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm">
        <div class="font-bold mb-3 navy-text">分科正確率</div>
        ${Object.entries(bySubj).length === 0 ? '<div class="text-sm text-stone-400">尚無資料</div>' :
          Object.entries(bySubj).map(([subj, data]) => {
            const pct = data.tries > 0 ? Math.round((data.correct / data.tries) * 100) : 0;
            return `
              <div class="mb-3 last:mb-0">
                <div class="flex justify-between text-sm mb-1">
                  <span class="font-semibold">${subj}</span>
                  <span class="text-stone-500">${data.correct}/${data.tries} = ${pct}%</span>
                </div>
                <div class="h-2 bg-stone-100 rounded-full overflow-hidden">
                  <div class="h-full ${pct >= 70 ? 'bg-green-500' : pct >= 50 ? 'bg-orange-400' : 'bg-red-400'} progress-bar" style="width:${pct}%"></div>
                </div>
              </div>
            `;
          }).join('')
        }
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm">
        <div class="font-bold mb-3 navy-text">分等級正確率</div>
        ${Object.entries(byTier).length === 0 ? '<div class="text-sm text-stone-400">尚無資料</div>' :
          Object.entries(byTier).sort((a,b) => ['S','A','B','C'].indexOf(a[0]) - ['S','A','B','C'].indexOf(b[0])).map(([tier, data]) => {
            const pct = data.tries > 0 ? Math.round((data.correct / data.tries) * 100) : 0;
            return `
              <div class="mb-3 last:mb-0">
                <div class="flex justify-between text-sm mb-1">
                  <span class="font-semibold">${tier} 級</span>
                  <span class="text-stone-500">${data.correct}/${data.tries} = ${pct}%</span>
                </div>
                <div class="h-2 bg-stone-100 rounded-full overflow-hidden">
                  <div class="h-full ${pct >= 70 ? 'bg-green-500' : pct >= 50 ? 'bg-orange-400' : 'bg-red-400'} progress-bar" style="width:${pct}%"></div>
                </div>
              </div>
            `;
          }).join('')
        }
      </div>
    </div>
  `;
}

// ============ INIT ============
(async () => {
  await loadData();
  render();
})();
</script>

</body>
</html>
